services:
  league-profile-service:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVICE_PORT:-5207}:5207"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:5207}
      RIOT_LEAGUE_RSO_APPROVED: "false"
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-}
      PROXY_CLIENT_IP_HEADER: ${PROXY_CLIENT_IP_HEADER:-x-real-ip}
    volumes:
      - league-profile-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=16m,mode=1777']
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5207/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  league-profile-data:
